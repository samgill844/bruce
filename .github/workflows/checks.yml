name: Tests and documentation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . matplotlib emcee corner multiprocess h5py
          python -m pip install -r docs/requirements.txt PyYAML 'bibtexparser>=1.4,<2'
      - name: Regression tests (ellc comparison is optional)
        run: python -m unittest discover -s tests/regression -v
      - name: Source and documentation checks
        run: |
          python paper/scripts/check_paper.py
          python docs/scripts/generate_api.py
          python docs/scripts/generate_c_api.py
          git diff --exit-code -- docs/api
          python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Execute numerical examples
        run: |
          python docs/examples/transit.py
          python docs/examples/radial_velocity.py
          python docs/examples/template_search.py
          python docs/examples/orbit.py
